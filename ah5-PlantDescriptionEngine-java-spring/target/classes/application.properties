############################################
###       APPLICATION PARAMETERS         ###
############################################

server.address=0.0.0.0
server.port=8432

# PlantDescriptionEngine owns this database: plant descriptions, alarms and the operational logs.
spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/ah_plantdescriptionengine?sslMode=trust
spring.datasource.username=plantdescriptionengine
spring.datasource.password=change-me
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

mqtt.api.enabled=false

# Native sysMonitor (SysMonitor-MQTT-IDD-5.2.2) by the common-library publisher: echo, power and
# status observations over MQTT with mutual TLS (server.ssl stores unless sysmonitor.ssl.* is set).
# echo is degraded while the plant cannot be synchronized or alarms are active.
sysmonitor.enabled=true
sysmonitor.broker.address=amqp-broker
sysmonitor.broker.port=5671
# sysmonitor.local.cloud defaults to the cloud part of this system's certificate CN
#sysmonitor.local.cloud=TestCloud
sysmonitor.service.instance=PlantDescriptionEngine
sysmonitor.publish.interval=30

############################################
###          CUSTOM PARAMETERS           ###
############################################

domain.name=127.0.0.1
authentication.policy=declared
enable.management.filter=true
management.policy=authorization
# Per-call ConsumerAuthorization check of every plantDescriptionMonitor operation; requires a reachable ConsumerAuthorization.
# plantDescriptionManagement is under /mgmt/ and guarded by management.policy.
service.authorization.enabled=false
enable.blacklist.filter=false
force.blacklist.filter=true
log.all.request.and.response=false
allow.self.addressing=true
allow.non.routable.addressing=false
normalization.mode=extended

# Largest accepted plant description (characters of its JSON document).
plant.description.max.size=200000
# Milliseconds between synchronizations of the orchestration rules and alarms (also run after every change).
plant.sync.interval=15000
# Priority of the DSO provider rule of a connection without priority.
plant.rule.default.priority=1
# Alarm on plant systems without recent sysMonitor observations (sysMonitorHistory).
plant.monitoring.enabled=true
plant.monitoring.stale.after.seconds=120
# Registered systems that never raise SYSTEM_NOT_IN_DESCRIPTION.
plant.alarm.ignored.systems=ServiceRegistry,DynamicServiceOrchestration,SimpleStoreServiceOrchestration,ConsumerAuthorization,Authentication,Blacklist,DeviceQoSEvaluator,TranslationManager,SysMonitor,LocalCloudManager,PlantDescriptionEngine

############################################
###             SSL MODE                 ###
############################################

# Development sample only. TLS is off here, and the authentication policy above may be 'declared'.
# A system refuses to start with these values unless arrowhead.security.profile=development is
# selected explicitly outside this file (for example ARROWHEAD_SECURITY_PROFILE=development) for an
# isolated test. Deployments use the secure configuration; see SECURITY-PROFILE.md in the repository root.
server.ssl.enabled=false
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:certificate/PlantDescriptionEngine.p12
server.ssl.key-store-password=123456
# Alias follows the local cloud name (ARROWHEAD_CLOUD_NAME, default TestCloud)
server.ssl.key-alias=PlantDescriptionEngine.${arrowhead.cloud.name:TestCloud}.Company.arrowhead.eu
server.ssl.key-password=123456
server.ssl.client-auth=none
server.ssl.trust-store-type=PKCS12
server.ssl.trust-store=classpath:certificate/truststore.p12
server.ssl.trust-store-password=123456
disable.hostname.verifier=false
