############################################
###       APPLICATION PARAMETERS         ###
############################################

server.address=0.0.0.0
server.port=8475

# SysMonitor owns this database: subscriptions, AMQP bindings, the MQTT outbox, the observation history, the audit trail
# and the operational logs.
spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/ah_sysmonitor?sslMode=trust
spring.datasource.username=sysmonitor
spring.datasource.password=change-me
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.task.scheduling.pool.size=4

mqtt.api.enabled=false

# Native sysMonitor of SysMonitor itself (SysMonitor-AMQP-IDD-5.2.2) by the common-library publisher; routing key
# <cloud>.sysmonitor.SysMonitor.SysMonitor.<type>. The broker settings are also those of the observation intake.
sysmonitor.enabled=false
sysmonitor.broker.address=amqp-broker
sysmonitor.broker.port=5671
sysmonitor.publish.interval=30
# Development sample: plain AMQP/MQTT. Deployments keep the default (true): mutual TLS with the system certificate.
sysmonitor.ssl.enabled=false

############################################
###          CUSTOM PARAMETERS           ###
############################################

domain.name=127.0.0.1
authentication.policy=declared
# generalManagement (/mgmt/ paths): Sysop and LocalCloudManager. sysMonitorManagement: LocalCloudManager and Sysop.
enable.management.filter=true
management.policy=whitelist
management.whitelist=LocalCloudManager
# sysMonitorHistory operations are decided by ConsumerAuthorization when true (deployments); off in this sample
service.authorization.enabled=false
log.all.request.and.response=false
allow.self.addressing=true
allow.non.routable.addressing=false
normalization.mode=extended

############################################
###          SYSMONITOR PARAMETERS        ###
############################################

# MQTT v5 broker of the sysMonitorData output (topic arrowhead/<cloud>/sysmonitor/data/<type>/<provider>)
sysmonitor.mqtt.address=mqtt-broker
sysmonitor.mqtt.port=8883
# Observations received longer ago are pruned every sysmonitor.prune.interval.seconds
sysmonitor.retention.days=30
sysmonitor.prune.interval.seconds=3600
# Providers without a subscription: all (bind every type) or none
sysmonitor.default.subscription=all
sysmonitor.orchestration.interval.seconds=30
sysmonitor.outbox.interval.millis=1000
sysmonitor.connect.interval.seconds=5

############################################
###             SSL MODE                 ###
############################################

# Development sample only. TLS is off here, and the authentication policy above may be 'declared'.
# A system refuses to start with these values unless arrowhead.security.profile=development is
# selected explicitly outside this file (for example ARROWHEAD_SECURITY_PROFILE=development) for an
# isolated test. Deployments use the secure configuration; see SECURITY-PROFILE.md in the repository root.
server.ssl.enabled=false
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:certificate/SysMonitor.p12
server.ssl.key-store-password=123456
server.ssl.key-alias=SysMonitor.${arrowhead.cloud.name:TestCloud}.Company.arrowhead.eu
server.ssl.key-password=123456
server.ssl.client-auth=none
server.ssl.trust-store-type=PKCS12
server.ssl.trust-store=classpath:certificate/truststore.p12
server.ssl.trust-store-password=123456
disable.hostname.verifier=false
