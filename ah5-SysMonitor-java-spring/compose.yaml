name: ah5-sysmonitor
services:
  sysmonitor:
    build:
      context: .
    image: arrowhead-sysmonitor-standalone:5.2.2
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777"]
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8475}:8475"
    environment:
      LOCAL_CLOUD: "${LOCAL_CLOUD:-TestCloud}"
      ORGANIZATION: "${ORGANIZATION:-Company}"
      SERVICE_REGISTRY_URL: "${SERVICE_REGISTRY_URL:-https://serviceregistry:8443}"
      AUTHENTICATION_PASSWORD_FILE: "/run/secrets/identity-password"
      PORT: "8475"
      HEALTH_PORT: "8482"
      DB_PATH: "/data/sysmonitor.db"
      TLS_CA_CERT: "/certs/ca.crt"
      TLS_CERT: "/certs/sysmonitor.crt"
      TLS_KEY: "/certs/sysmonitor.key"
      TLS_SERVER_CERT: "/certs/sysmonitor.crt"
      TLS_SERVER_KEY: "/certs/sysmonitor.key"
      CRL_FILE: "/crl/ca.crl"
      AMQP_HOST: "${AMQP_HOST:-amqp-broker}"
      AMQP_PORT: "${AMQP_PORT:-5671}"
      MQTT_HOST: "${MQTT_HOST:-mqtt-broker}"
      MQTT_PORT: "${MQTT_PORT:-8883}"
      SYSMONITOR_RETENTION_DAYS: "${SYSMONITOR_RETENTION_DAYS:-30}"
      SYSMONITOR_DEFAULT_SUBSCRIPTION: "${SYSMONITOR_DEFAULT_SUBSCRIPTION:-all}"
      ORCHESTRATION_INTERVAL_SECONDS: "30"
    secrets: [identity-password]
    volumes:
      - state:/data
      - type: bind
        source: ${SYSTEM_CERT_FILE:-./security/sysmonitor.crt}
        target: /certs/sysmonitor.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SYSTEM_KEY_FILE:-./security/sysmonitor.key}
        target: /certs/sysmonitor.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CLOUD_CA_FILE:-./security/ca.crt}
        target: /certs/ca.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CRL_DIRECTORY:-./security/crl}
        target: /crl
        read_only: true
        bind:
          create_host_path: false
    networks:
      cloud:
        aliases: [sysmonitor]
volumes:
  state: {}
secrets:
  identity-password:
    file: ${IDENTITY_PASSWORD_FILE:-./security/identity-password}
networks:
  cloud:
    external: true
    name: ${ARROWHEAD_NETWORK:-arrowhead-local-cloud}
