# Production deployment overrides; base application properties remain development examples.
spring.config.import=configtree:/run/secrets/
server.address=0.0.0.0
server.port=8475
domain.name=sysmonitor
arrowhead.cloud.name=${LOCAL_CLOUD:TestCloud}
server.ssl.enabled=true
server.ssl.key-store=file:/certs/SysMonitor.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${ah.store-password}
server.ssl.key-password=${ah.store-password}
server.ssl.key-alias=SysMonitor.${LOCAL_CLOUD:TestCloud}.${ORGANIZATION:Company}.arrowhead.eu
server.ssl.trust-store=file:/certs/truststore.p12
server.ssl.trust-store-type=PKCS12
server.ssl.trust-store-password=${ah.store-password}
server.ssl.client-auth=need
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
disable.hostname.verifier=false
authentication.policy=outsourced
authenticator.credentials={'password':'${ah.identity-password}'}
service.interface.policy=CERT_AUTH
# generalManagement (/sysmonitor/mgmt/general): Sysop and LocalCloudManager, as before
enable.management.filter=true
management.policy=whitelist
management.whitelist=LocalCloudManager
# sysMonitorHistory operations are decided by ConsumerAuthorization
service.authorization.enabled=true
# client certificates of the HTTPS API and the broker certificates are checked against the CRL of the cloud CA
arrowhead.ssl.crl-file=${CRL_FILE:/crl/ca.crl}
service.registry.address=${SERVICE_REGISTRY_ADDRESS:serviceregistry}
service.registry.port=${SERVICE_REGISTRY_PORT:8443}
spring.datasource.url=jdbc:mariadb://sysmonitor-db:3306/ah_sysmonitor?sslMode=verify-full&serverSslCert=/certs/db-ca.crt
spring.datasource.username=sysmonitor
spring.datasource.password=${ah.db-password}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.task.scheduling.pool.size=4
# AMQP broker: the intake of the monitored providers' observations and the system's own sysMonitor publisher
sysmonitor.enabled=${SYSMONITOR_ENABLED:true}
sysmonitor.broker.address=${AMQP_HOST:amqp-broker}
sysmonitor.broker.port=${AMQP_PORT:5671}
sysmonitor.local.cloud=${LOCAL_CLOUD:TestCloud}
# the packaged default is false (development); the secure profile refuses to start without TLS to the brokers
sysmonitor.ssl.enabled=true
sysmonitor.ssl.key-store=file:/certs/SysMonitor.p12
sysmonitor.ssl.key-store-password=${ah.store-password}
sysmonitor.ssl.trust-store=file:/certs/truststore.p12
sysmonitor.ssl.trust-store-password=${ah.store-password}
# MQTT v5 broker of the sysMonitorData output
sysmonitor.mqtt.address=${MQTT_HOST:mqtt-broker}
sysmonitor.mqtt.port=${MQTT_PORT:8883}
sysmonitor.retention.days=${SYSMONITOR_RETENTION_DAYS:30}
sysmonitor.prune.interval.seconds=${SYSMONITOR_PRUNE_INTERVAL_SECONDS:3600}
sysmonitor.default.subscription=${SYSMONITOR_DEFAULT_SUBSCRIPTION:all}
sysmonitor.orchestration.interval.seconds=${ORCHESTRATION_INTERVAL_SECONDS:30}
mqtt.api.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
