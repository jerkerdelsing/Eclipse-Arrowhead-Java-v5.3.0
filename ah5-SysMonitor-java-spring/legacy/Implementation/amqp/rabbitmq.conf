# Local-cloud AMQP 0-9-1 broker: mutual TLS only, the client certificate CN is the user name.
listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /etc/rabbitmq/tls/ca.crt
ssl_options.certfile = /etc/rabbitmq/tls/amqp-broker.crt
ssl_options.keyfile = /etc/rabbitmq/tls/amqp-broker.key
ssl_options.verify = verify_peer
ssl_options.fail_if_no_peer_cert = true
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2
auth_mechanisms.1 = EXTERNAL
ssl_cert_login_from = common_name
load_definitions = /etc/rabbitmq/definitions.json
loopback_users = none
log.console = true
log.console.level = warning
