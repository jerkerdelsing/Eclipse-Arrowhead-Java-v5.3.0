server.address=0.0.0.0
server.port=8435
domain.name=${ONBOARDING_HOST:localhost}
spring.datasource.url=jdbc:mariadb://localhost:3306/ah_onboarding?sslMode=trust
spring.datasource.username=${ONBOARDING_DB_USER:onboarding}
spring.datasource.password=${ONBOARDING_DB_PASSWORD}
# Also read by the log4j2 JDBC appender (common JDBCConnectionFactoryForLog4J2)
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
mqtt.api.enabled=false
# Management calls need an identity token bound to the caller's client certificate (outsourced policy);
# device enrollment is authenticated separately by the approved bootstrap certificate.
authentication.policy=outsourced
service.interface.policy=CERT_AUTH
enable.management.filter=true
management.policy=sysop-only
enable.blacklist.filter=false
log.all.request.and.response=false
normalization.mode=extended
server.ssl.enabled=true
server.ssl.key-store-type=PKCS12
server.ssl.key-store=${ONBOARDING_TLS_KEYSTORE}
server.ssl.key-store-password=${ONBOARDING_TLS_PASSWORD}
server.ssl.key-alias=${ONBOARDING_TLS_ALIAS}
server.ssl.key-password=${ONBOARDING_TLS_PASSWORD}
# Mutual TLS: every caller, including an enrolling device, must present a trusted client certificate.
server.ssl.client-auth=need
server.ssl.trust-store-type=PKCS12
server.ssl.trust-store=${ONBOARDING_TRUSTSTORE}
server.ssl.trust-store-password=${ONBOARDING_TRUSTSTORE_PASSWORD}
disable.hostname.verifier=false
# Onboarding holds no CA key: the local-cloud CertificateAuthority signs every certificate of the procedure.
# Devices are approved at run time through onboardingManagement (approve-device), not in configuration.
# service.registry.address=<registry-host>
# service.registry.port=8443
