############################################
###          CUSTOM PARAMETERS           ###
############################################

# Address to register into Service Registry with
domain.name=127.0.0.1

# Method to authenticate service requester systems
authentication.policy=declared

# Credentials to login to the authentication servers when authentication policy is 'outsourced'.
# The cloud operator need to register this system to this system to the Authentication Core system and fill the password field with the actual password before starting this system.
# authenticator.credentials={\
#  	'password': '123456' \
# }

# Enable/disable automatic authorization for management services
enable.management.filter=true

# Define the access policy for management services
# Values: sysop-only, whitelist, authorization
management.policy=authorization

# Name of systems which can access management service in case of whitelist policy
management.whitelist=

# Enable/disable automatic system name verification against cloud level blacklist (lookup for 'blacklist' service and use it)
enable.blacklist.filter=false

# If true, the blacklist filter will filter out the request even if the blacklist server is not available
force.blacklist.filter=true

# Name of systems which are excluded from the blacklist check
# blacklist.check.exclude.list=

# Specifies the maximum number of records a page can contain
# max.page.size=

# Specifies how to normalize system, service definition, service operation, interface template names and cloud identifiers in requests. In simple mode, normalization only removes starting and
# ending whitespaces and the requester's responsibility to make sure the various naming conventions are used. In extended mode, normalization tries to transform inputs to follow the appropriate
# naming convention.
normalization.mode=extended

# Specifies how often (in sec) to synchronize the device and system tables by querying the ServiceRegistry Core System and to reorganize the measurements
measurement.organizer.job.interval=17

# Specifies the frequency (in sec) for measuring the round-trip time to the devices.
rtt.measurement.job.interval=10

# Specifies how long to wait (in milisec) for response during a round-trip time measurement.
# This value is also considered as 100% (worst case) when scaling during the evaluation process.
rtt.measurement.timeout=5000

# Specifies the frequency (in sec) of fetching the augmented measurement results from the devices
augmented.measurement.job.interval=13

# Specifies the size of the time window (in sec) to be evaluated
evaluation.time.window=60

# Specifies how often (in sec) to run the cleaning job
cleaning.job.interval=60

# Specifies when to remove (in minutes) the raw measurement data from the database
raw.measurement.data.max.age=15

# Specifies when to remove (in minutes) the inactive devices from the database
# (removal only occurs if raw measurement data is not available for the given device)
inactive.device.max.age=30

############################################
###             SSL MODE                 ###
############################################

# configure secure mode

# Set this to false to disable https mode
server.ssl.enabled=false

server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:certificate/DeviceQoSEvaluator.p12
server.ssl.key-store-password=123456
# Alias follows the local cloud name (ARROWHEAD_CLOUD_NAME, default TestCloud)
server.ssl.key-alias=DeviceQoSEvaluator.${arrowhead.cloud.name:TestCloud}.Company.arrowhead.eu
server.ssl.key-password=123456
# Set to "need" in case of CERTIFICATE authentication policy
server.ssl.client-auth=none
server.ssl.trust-store-type=PKCS12
server.ssl.trust-store=classpath:certificate/truststore.p12
server.ssl.trust-store-password=123456

#If true, http client does not check whether the hostname is match one of the server's SAN in its certificate
disable.hostname.verifier=false

############################################
###                QUARTZ                ###
############################################

org.quartz.threadPool.threadCount=60

# Do not change
spring.quartz.auto-startup=false
spring.quartz.job-store-type=memory