name: ah5-translation-manager
services:
  translation-manager:
    build:
      context: .
    image: arrowhead-translation-manager-standalone:5.2.2
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 256
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777", "/app/logs:rw,noexec,nosuid,nodev,size=32m,mode=1777"]
    ports: ["${HOST_BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8465}:8465"]
    depends_on:
      translation-manager-db:
        condition: service_healthy
    environment:
      LOCAL_CLOUD: ${LOCAL_CLOUD:-TestCloud}
      ORGANIZATION: ${ORGANIZATION:-Company}
      SERVICE_REGISTRY_ADDRESS: ${SERVICE_REGISTRY_ADDRESS:-serviceregistry}
      SERVICE_REGISTRY_PORT: "${SERVICE_REGISTRY_PORT:-8443}"
      AMQP_HOST: ${AMQP_HOST:-amqp-broker}
      AMQP_PORT: "${AMQP_PORT:-5671}"
      SYSMONITOR_ENABLED: "${SYSMONITOR_ENABLED:-true}"
    secrets:
      - source: store-password
        target: ah.store-password
      - source: identity-password
        target: ah.identity-password
      - source: db-password
        target: ah.db-password
    volumes:
      - type: bind
        source: ${SYSTEM_KEYSTORE_FILE:-./security/TranslationManager.p12}
        target: /certs/TranslationManager.p12
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${TRUSTSTORE_FILE:-./security/truststore.p12}
        target: /certs/truststore.p12
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${DB_CA_FILE:-./security/db-ca.crt}
        target: /certs/db-ca.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${CRL_DIRECTORY:-./security/crl}
        target: /crl
        read_only: true
        bind: {create_host_path: false}
    networks:
      cloud:
        aliases: [translation-manager]
      database: {}
  translation-manager-db:
    build:
      context: .
      dockerfile: deployment/database/Dockerfile
    image: arrowhead-translation-manager-standalone-db:5.2.2
    environment:
      MYSQL_DATABASE: ah_translation_manager
      MYSQL_USER: translationmanager
      MYSQL_PASSWORD_FILE: /run/secrets/db-password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db-root-password
    secrets: [db-password, db-root-password]
    command: ["--ssl-ca=/tls/ca.crt", "--ssl-cert=/tls/db.crt", "--ssl-key=/tls/db.key", "--require-secure-transport=ON"]
    volumes:
      - state:/var/lib/mysql
      - type: bind
        source: ${DB_CA_FILE:-./security/db-ca.crt}
        target: /tls/ca.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${DB_CERT_FILE:-./security/db.crt}
        target: /tls/db.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${DB_KEY_FILE:-./security/db.key}
        target: /tls/db.key
        read_only: true
        bind: {create_host_path: false}
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=tcp -h127.0.0.1 --silent"]
      interval: 5s
      timeout: 4s
      retries: 30
volumes:
  state: {}
networks:
  cloud:
    external: true
    name: ${ARROWHEAD_NETWORK:-arrowhead-local-cloud}
  database:
    internal: true
    ipam:
      config:
        - subnet: ${DB_SUBNET:-10.252.202.0/24}
secrets:
  identity-password:
    file: ${IDENTITY_PASSWORD_FILE:-./security/identity-password}
  store-password:
    file: ${STORE_PASSWORD_FILE:-./security/store-password}
  db-password:
    file: ${DB_PASSWORD_FILE:-./security/db-password}
  db-root-password:
    file: ${DB_ROOT_PASSWORD_FILE:-./security/db-root-password}
