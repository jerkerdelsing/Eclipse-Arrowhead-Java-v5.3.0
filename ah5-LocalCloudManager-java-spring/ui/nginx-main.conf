# nginx main configuration of the console UI. The server block is rendered from /etc/nginx/templates at start into /tmp
# (writable on a read-only root filesystem, J3), so the console's address and proxy secret come from the environment.
worker_processes  auto;
error_log  /dev/stderr notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile        on;
    keepalive_timeout  65;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;
    include /tmp/*.conf;
}
