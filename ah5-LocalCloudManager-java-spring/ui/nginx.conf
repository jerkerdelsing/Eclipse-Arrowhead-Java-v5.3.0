# Console UI server, rendered by the nginx image's envsubst step from these variables (empty = feature off):
#   CONSOLE_CANONICAL_HOST, CONSOLE_CANONICAL_ORIGIN  the console's own address (J6): any other host name is redirected
#                                                     there, so the session cookie lives only on that host name
#   CONSOLE_PROXY_SECRET                               added to every API request; the API serves no request without it
server {
    listen 8490;
    server_name _;

    # Re-resolve the API container after a Compose recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $monitor_api http://cloud-monitor-api:8491;
    set $canonical_host "${CONSOLE_CANONICAL_HOST}";
    set $redirect "";
    if ($canonical_host != "") { set $redirect "1"; }
    if ($host = $canonical_host) { set $redirect ""; }

    # The console must not be framed by another site (its login and confirmations).
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        if ($redirect) { return 308 ${CONSOLE_CANONICAL_ORIGIN}$request_uri; }
        proxy_pass $monitor_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # the client address the API counts failed logins against (J6), never one the client chose
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Console-Proxy "${CONSOLE_PROXY_SECRET}";
        proxy_read_timeout 30s;
    }

    # container healthcheck: no redirect
    location /health {
        proxy_pass $monitor_api/health;
    }

    location / {
        if ($redirect) { return 308 ${CONSOLE_CANONICAL_ORIGIN}$request_uri; }
        try_files $uri $uri/ /index.html;
    }
}
