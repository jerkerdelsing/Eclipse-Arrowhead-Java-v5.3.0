############################################
###       APPLICATION PARAMETERS         ###
############################################

# Arrowhead connector (mutual TLS in deployments): localCloudManagement, generalManagement
server.address=0.0.0.0
server.port=8491

service.registry.address=127.0.0.1
service.registry.port=8443

mqtt.api.enabled=false

# Native sysMonitor (SysMonitor-AMQP-IDD-5.2.2) by the common-library publisher.
sysmonitor.enabled=false
sysmonitor.broker.address=amqp-broker
sysmonitor.broker.port=5671
sysmonitor.service.instance=LocalCloudManager

# Providers are selected by orchestration on behalf of LocalCloudManager (ServiceRegistry lookup only for bootstrap services)
http.collector.mode=ORCHESTRATION
http.collector.orchestration.ttl=300

############################################
###          CUSTOM PARAMETERS           ###
############################################

domain.name=127.0.0.1
authentication.policy=declared
enable.management.filter=true
management.policy=sysop-only
log.all.request.and.response=false
normalization.mode=extended

# localCloudManagement on the Arrowhead connector: Sysop, these systems, or a ConsumerAuthorization grant
lcm.api.whitelist=
service.authorization.enabled=false

# Operator console: plain HTTP with password login (scrypt hash "scrypt:<salt>:<hash>"); publish on host loopback only
console.port=8490
console.address=127.0.0.1
console.password.hash=
console.allowed.hosts=127.0.0.1,localhost,[::1]
console.proxy-secret=
console.session.seconds=28800

lcm.compose-project=arrowhead-v52-test-cloud
lcm.docker.url=http://127.0.0.1:2375
lcm.managed-services=
lcm.local-cloud=TestCloud
lcm.release=5.3.0
lcm.local-cloud-configuration.enabled=true
lcm.so-local-cloud-configuration.enabled=true
lcm.chiplet-floorplans.enabled=false
lcm.chiplet-manager=false
lcm.orchestration-priority-mode=native

############################################
###             SSL MODE                 ###
############################################

# Development sample only. TLS is off here, and the authentication policy above may be 'declared'.
# A system refuses to start with these values unless arrowhead.security.profile=development is
# selected explicitly outside this file (for example ARROWHEAD_SECURITY_PROFILE=development) for an
# isolated test. Deployments use the secure configuration; see SECURITY-PROFILE.md in the repository root.
server.ssl.enabled=false
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:certificate/LocalCloudManager.p12
server.ssl.key-store-password=123456
server.ssl.key-alias=LocalCloudManager.${arrowhead.cloud.name:TestCloud}.Company.arrowhead.eu
server.ssl.key-password=123456
server.ssl.client-auth=none
server.ssl.trust-store-type=PKCS12
server.ssl.trust-store=classpath:certificate/truststore.p12
server.ssl.trust-store-password=123456
disable.hostname.verifier=false
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
