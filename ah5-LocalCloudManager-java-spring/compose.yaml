name: ah5-localcloudmanager
services:
  cloud-monitor-api:
    build: {context: .}
    image: arrowhead-localcloudmanager-standalone:5.3.0
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    pids_limit: 256
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777", "/app/logs:rw,noexec,nosuid,nodev,size=32m,mode=1777"]
    # console (password login) on the host's loopback interface only, and answered only for the Docker gateway of the
    # published port (other systems on the cloud network are refused: J6); the Arrowhead connector 8491 stays inside the cloud
    # network
    ports: ["${HOST_BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8490}:8490"]
    environment:
      LOCAL_CLOUD: ${LOCAL_CLOUD:-TestCloud}
      ORGANIZATION: ${ORGANIZATION:-Company}
      SERVICE_REGISTRY_ADDRESS: ${SERVICE_REGISTRY_ADDRESS:-serviceregistry}
      SERVICE_REGISTRY_PORT: "${SERVICE_REGISTRY_PORT:-8443}"
      AMQP_HOST: ${AMQP_HOST:-amqp-broker}
      AMQP_PORT: "${AMQP_PORT:-5671}"
      SYSMONITOR_ENABLED: "${SYSMONITOR_ENABLED:-true}"
      COMPOSE_PROJECT_NAME: ${MANAGED_PROJECT:-arrowhead-v52-test-cloud}
      DOCKER_API_URL: http://docker-proxy:2375
      MANAGED_SERVICES: ${MANAGED_SERVICES:-}
      CONSOLE_ALLOWED_HOSTS: ${CONSOLE_ALLOWED_HOSTS:-127.0.0.1,localhost,[::1]}
      CONSOLE_ALLOWED_CLIENTS: ${CONSOLE_ALLOWED_CLIENTS:-}
      LOCAL_CLOUD_CONFIGURATION_ENABLED: "${LOCAL_CLOUD_CONFIGURATION_ENABLED:-true}"
      SO_LOCAL_CLOUD_CONFIGURATION_ENABLED: "${SO_LOCAL_CLOUD_CONFIGURATION_ENABLED:-false}"
      CHIPLET_FLOORPLANS_ENABLED: "${CHIPLET_FLOORPLANS_ENABLED:-false}"
      CHIPLET_MANAGER: "${CHIPLET_MANAGER:-false}"
      LCM_API_WHITELIST: ${LCM_API_WHITELIST:-}
    secrets:
      - source: store-password
        target: ah.store-password
      - source: identity-password
        target: ah.identity-password
      - source: console-password-hash
        target: ah.console-password-hash
    volumes:
      - type: bind
        source: ${SYSTEM_KEYSTORE_FILE:-./security/LocalCloudManager.p12}
        target: /certs/LocalCloudManager.p12
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${TRUSTSTORE_FILE:-./security/truststore.p12}
        target: /certs/truststore.p12
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${CRL_DIRECTORY:-./security/crl}
        target: /crl
        read_only: true
        bind: {create_host_path: false}
    depends_on: [docker-proxy]
    networks:
      cloud:
        aliases: [cloud-monitor-api]
      control: {}
  docker-proxy:
    build: {context: ./docker-proxy}
    image: arrowhead-localcloudmanager-docker-proxy-standalone:5.3.0
    # SOS-8 (2026-11-10): not root. Group 0 is enough for the socket (srw-rw---- root:root on Docker Desktop); the user
    # gets no capability and cannot gain any (cap_drop, no-new-privileges)
    user: "10001:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 192m
    pids_limit: 64
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777"]
    environment:
      COMPOSE_PROJECT_NAME: ${MANAGED_PROJECT:-arrowhead-v52-test-cloud}
      MANAGED_SERVICES: ${MANAGED_SERVICES:-sysmonitor,datamanager,timemanager,eventhandler}
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    # only the console API can reach the proxy
    networks: [control]
networks:
  cloud:
    external: true
    name: ${ARROWHEAD_NETWORK:-arrowhead-local-cloud}
  control:
    internal: true
    ipam:
      config:
        - subnet: ${CONTROL_SUBNET:-10.252.220.0/24}
secrets:
  identity-password:
    file: ${IDENTITY_PASSWORD_FILE:-./security/identity-password}
  store-password:
    file: ${STORE_PASSWORD_FILE:-./security/store-password}
  console-password-hash:
    file: ${CONSOLE_PASSWORD_HASH_FILE:-./security/console-password-hash}
