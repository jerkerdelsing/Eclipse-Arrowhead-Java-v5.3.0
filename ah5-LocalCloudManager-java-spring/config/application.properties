# Production deployment overrides; the packaged application.properties is a development example.
spring.config.import=configtree:/run/secrets/
server.address=0.0.0.0
server.port=8491
domain.name=${LCM_DOMAIN_NAME:cloud-monitor-api}
arrowhead.cloud.name=${LOCAL_CLOUD:TestCloud}
server.ssl.enabled=true
server.ssl.key-store=file:/certs/LocalCloudManager.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${ah.store-password}
server.ssl.key-password=${ah.store-password}
server.ssl.key-alias=LocalCloudManager.${LOCAL_CLOUD:TestCloud}.${ORGANIZATION:Company}.arrowhead.eu
server.ssl.trust-store=file:/certs/truststore.p12
server.ssl.trust-store-type=PKCS12
server.ssl.trust-store-password=${ah.store-password}
server.ssl.client-auth=need
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
disable.hostname.verifier=false
authentication.policy=outsourced
authenticator.credentials={'password':'${ah.identity-password}'}
service.interface.policy=CERT_AUTH
enable.management.filter=true
management.policy=sysop-only
service.authorization.enabled=true
lcm.api.whitelist=${LCM_API_WHITELIST:}
arrowhead.ssl.crl-file=${CRL_FILE:/crl/ca.crl}
service.registry.address=${SERVICE_REGISTRY_ADDRESS:serviceregistry}
service.registry.port=${SERVICE_REGISTRY_PORT:8443}
http.collector.mode=ORCHESTRATION
http.collector.orchestration.ttl=${ORCHESTRATION_TTL_SECONDS:300}
sysmonitor.enabled=${SYSMONITOR_ENABLED:true}
sysmonitor.broker.address=${AMQP_HOST:amqp-broker}
sysmonitor.broker.port=${AMQP_PORT:5671}
sysmonitor.local.cloud=${LOCAL_CLOUD:TestCloud}
sysmonitor.service.instance=LocalCloudManager
sysmonitor.ssl.key-store=file:/certs/LocalCloudManager.p12
sysmonitor.ssl.key-store-password=${ah.store-password}
sysmonitor.ssl.trust-store=file:/certs/truststore.p12
sysmonitor.ssl.trust-store-password=${ah.store-password}
# The console connector listens on all container interfaces; Compose publishes it on the host's loopback interface only.
# It answers only loopback, the Docker gateway of one of the container's networks (the published port) and
# console.allowed.clients; other systems on the cloud network are refused (J6).
console.port=8490
console.address=0.0.0.0
console.allowed.clients=${CONSOLE_ALLOWED_CLIENTS:}
console.password.hash=${ah.console-password-hash}
console.allowed.hosts=${CONSOLE_ALLOWED_HOSTS:127.0.0.1,localhost,[::1]}
console.proxy-secret=${CONSOLE_PROXY_SECRET:}
console.session.seconds=${CONSOLE_SESSION_SECONDS:28800}
lcm.compose-project=${COMPOSE_PROJECT_NAME:arrowhead-v52-test-cloud}
lcm.docker.url=${DOCKER_API_URL:http://docker-proxy:2375}
lcm.managed-services=${MANAGED_SERVICES:}
lcm.local-cloud=${LOCAL_CLOUD:TestCloud}
lcm.release=${ARROWHEAD_VERSION:5.2.2}
lcm.local-cloud-configuration.enabled=${LOCAL_CLOUD_CONFIGURATION_ENABLED:true}
lcm.chiplet-floorplans.enabled=${CHIPLET_FLOORPLANS_ENABLED:false}
lcm.chiplet-manager=${CHIPLET_MANAGER:false}
lcm.orchestration-priority-mode=${ORCHESTRATION_PRIORITY_MODE:native}
mqtt.api.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
