# Docker Engine API proxy of the LocalCloudManager console. Only the console API (on an internal network) may reach it.
server.address=0.0.0.0
server.port=2375
spring.main.banner-mode=off
docker.socket=${DOCKER_SOCKET:/var/run/docker.sock}
docker.project=${COMPOSE_PROJECT_NAME:}
docker.managed-services=${MANAGED_SERVICES:}
