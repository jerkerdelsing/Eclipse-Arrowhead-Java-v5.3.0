name: ah5-gatetunnel
services:
  gatetunnel:
    build:
      context: .
    image: arrowhead-gatetunnel-standalone:5.4.0
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 256
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777", "/app/logs:rw,noexec,nosuid,nodev,size=32m,mode=1777"]
    # 8453: Arrowhead API. The inter-cloud consumer tunnel listeners (8200-8299) are reached by local consumers on the
    # cloud network under the advertised address; they are not published on the host.
    ports: ["${HOST_BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8453}:8453"]
    depends_on:
      gatetunnel-db:
        condition: service_healthy
    environment:
      LOCAL_CLOUD: ${LOCAL_CLOUD:-TestCloud}
      ORGANIZATION: ${ORGANIZATION:-Company}
      SERVICE_REGISTRY_ADDRESS: ${SERVICE_REGISTRY_ADDRESS:-serviceregistry}
      SERVICE_REGISTRY_PORT: "${SERVICE_REGISTRY_PORT:-8443}"
      AMQP_HOST: ${AMQP_HOST:-amqp-broker}
      AMQP_PORT: "${AMQP_PORT:-5671}"
      SYSMONITOR_ENABLED: "${SYSMONITOR_ENABLED:-true}"
      ADVERTISED_ADDRESS: ${ADVERTISED_ADDRESS:-gatetunnel}
      FEDERATION_PROFILE: ${FEDERATION_PROFILE:-ah-gt-1}
      NEIGHBOR_CLOUDS: ${NEIGHBOR_CLOUDS:-}
      FEDERATION_PEER_ORGANIZATIONS: ${FEDERATION_PEER_ORGANIZATIONS:-}
      RELAY_HOST: ${RELAY_HOST:-arrowhead-relay}
      RELAY_PORT: "${RELAY_PORT:-8883}"
      RELAY_CHAIN_CERT: /certs/gatetunnel-relay-chain.crt
      RELAY_KEY: /certs/gatetunnel-relay.key
      RELAY_CA_CERT: /certs/org-ca.crt
      # SOS-6: the relay's server certificate is checked against the organisation CRL (fail closed)
      RELAY_CRL_FILE: /org-crl/org-ca.crl
      # AH-GT-1 peer revocation (SOS-4), mandatory: the organization CA's CRL and the CA CRL of every peer cloud, e.g.
      # /org-crl/org-ca.crl,/peer-crl/GoCloud/ca.crl. A peer whose CA has no current CRL here is refused.
      RELAY_CRL_FILES: ${RELAY_CRL_FILES:-/org-crl/org-ca.crl}
      MIN_TUNNEL_PORT: "${MIN_TUNNEL_PORT:-8000}"
      MAX_TUNNEL_PORT: "${MAX_TUNNEL_PORT:-8099}"
      INTERCLOUD_MIN_PORT: "${INTERCLOUD_MIN_PORT:-8200}"
      INTERCLOUD_MAX_PORT: "${INTERCLOUD_MAX_PORT:-8299}"
      SESSION_MAX_AGE_SECONDS: "${SESSION_MAX_AGE_SECONDS:-43200}"
      SESSION_IDLE_SECONDS: "${SESSION_IDLE_SECONDS:-3600}"
    secrets:
      - source: store-password
        target: ah.store-password
      - source: identity-password
        target: ah.identity-password
      - source: db-password
        target: ah.db-password
    volumes:
      - type: bind
        source: ${SYSTEM_KEYSTORE_FILE:-./security/GateTunnel.p12}
        target: /certs/GateTunnel.p12
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${TRUSTSTORE_FILE:-./security/truststore.p12}
        target: /certs/truststore.p12
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${DB_CA_FILE:-./security/db-ca.crt}
        target: /certs/db-ca.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${CRL_DIRECTORY:-./security/crl}
        target: /crl
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RELAY_CHAIN_FILE:-./security/gatetunnel-relay-chain.crt}
        target: /certs/gatetunnel-relay-chain.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RELAY_KEY_FILE:-./security/gatetunnel-relay.key}
        target: /certs/gatetunnel-relay.key
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${ORGANIZATION_CA_FILE:-./security/org-ca.crt}
        target: /certs/org-ca.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        # a directory (public files only): the CRL is replaced by rename, which a single-file mount loses (SOS-5)
        source: ${ORGANIZATION_CRL_DIRECTORY:-./security/org-crl}
        target: /org-crl
        read_only: true
        bind: {create_host_path: false}
      # the peer clouds' CA CRLs (one subdirectory per cloud)
      - type: bind
        source: ${PEER_CRL_DIRECTORY:-./security/peer-crl}
        target: /peer-crl
        read_only: true
        bind: {create_host_path: false}
    networks:
      cloud:
        aliases: [gatetunnel]
      database: {}
  gatetunnel-db:
    build:
      context: .
      dockerfile: deployment/database/Dockerfile
    image: arrowhead-gatetunnel-standalone-db:5.4.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ah_gatetunnel
      MYSQL_USER: gatetunnel
      MYSQL_PASSWORD_FILE: /run/secrets/db-password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db-root-password
    secrets: [db-password, db-root-password]
    command: ["--ssl-ca=/tls/ca.crt", "--ssl-cert=/tls/db.crt", "--ssl-key=/tls/db.key", "--require-secure-transport=ON"]
    volumes:
      - state:/var/lib/mysql
      - type: bind
        source: ${DB_CA_FILE:-./security/db-ca.crt}
        target: /tls/ca.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${DB_CERT_FILE:-./security/db.crt}
        target: /tls/db.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${DB_KEY_FILE:-./security/db.key}
        target: /tls/db.key
        read_only: true
        bind: {create_host_path: false}
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=tcp -h127.0.0.1 --silent"]
      interval: 5s
      timeout: 4s
      retries: 30
volumes:
  state: {}
networks:
  cloud:
    external: true
    name: ${ARROWHEAD_NETWORK:-arrowhead-local-cloud}
  database:
    internal: true
    ipam:
      config:
        - subnet: ${DB_SUBNET:-10.252.213.0/24}
secrets:
  identity-password:
    file: ${IDENTITY_PASSWORD_FILE:-./security/identity-password}
  store-password:
    file: ${STORE_PASSWORD_FILE:-./security/store-password}
  db-password:
    file: ${DB_PASSWORD_FILE:-./security/db-password}
  db-root-password:
    file: ${DB_ROOT_PASSWORD_FILE:-./security/db-root-password}
