############################################
###       APPLICATION PARAMETERS         ###
############################################
# Development example values only. This file alone does not meet the default secure profile (no TLS, declared
# authentication), so SecurityProfileGuard refuses to start with it unless arrowhead.security.profile=development is
# selected explicitly for an isolated test. Deployments use config/application.properties.

server.address=0.0.0.0
server.port=8453

service.registry.address=127.0.0.1
service.registry.port=8443

spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/ah_gatetunnel?sslMode=trust
spring.datasource.username=gatetunnel
spring.datasource.password=gT4kQe9vLw2nXs7
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

mqtt.api.enabled=false
domain.name=127.0.0.1
authentication.policy=declared
enable.management.filter=true
management.policy=whitelist
management.whitelist=LocalCloudManager,Sysop
log.all.request.and.response=false
normalization.mode=extended

server.ssl.enabled=false
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:certificate/GateTunnel.p12
server.ssl.key-store-password=123456
server.ssl.key-alias=GateTunnel.${arrowhead.cloud.name:TestCloud}.Company.arrowhead.eu
server.ssl.key-password=123456
server.ssl.client-auth=none
server.ssl.trust-store-type=PKCS12
server.ssl.trust-store=classpath:certificate/truststore.p12
server.ssl.trust-store-password=123456
disable.hostname.verifier=false

# GateTunnel
gatetunnel.federation.profile=legacy-mtls
gatetunnel.neighbor.clouds=GoCloud
gatetunnel.relay.host=127.0.0.1
gatetunnel.relay.port=8883
