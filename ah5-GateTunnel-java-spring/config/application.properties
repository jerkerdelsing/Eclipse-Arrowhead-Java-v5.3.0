# Production deployment overrides; base application properties remain development examples.
spring.config.import=configtree:/run/secrets/
server.address=0.0.0.0
server.port=8453
domain.name=${DOMAIN_NAME:gatetunnel}
arrowhead.cloud.name=${LOCAL_CLOUD:TestCloud}
server.ssl.enabled=true
server.ssl.key-store=file:/certs/GateTunnel.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${ah.store-password}
server.ssl.key-password=${ah.store-password}
server.ssl.key-alias=GateTunnel.${LOCAL_CLOUD:TestCloud}.${ORGANIZATION:Company}.arrowhead.eu
server.ssl.trust-store=file:/certs/truststore.p12
server.ssl.trust-store-type=PKCS12
server.ssl.trust-store-password=${ah.store-password}
server.ssl.client-auth=need
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
disable.hostname.verifier=false
authentication.policy=outsourced
authenticator.credentials={'password':'${ah.identity-password}'}
service.interface.policy=CERT_AUTH
enable.management.filter=true
management.policy=whitelist
management.whitelist=LocalCloudManager,Sysop
service.authorization.enabled=true
enable.blacklist.filter=${ENABLE_BLACKLIST_FILTER:false}
arrowhead.ssl.crl-file=${CRL_FILE:/crl/ca.crl}
service.registry.address=${SERVICE_REGISTRY_ADDRESS:serviceregistry}
service.registry.port=${SERVICE_REGISTRY_PORT:8443}
spring.datasource.url=jdbc:mariadb://gatetunnel-db:3306/ah_gatetunnel?sslMode=verify-full&serverSslCert=/certs/db-ca.crt
spring.datasource.username=gatetunnel
spring.datasource.password=${ah.db-password}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
sysmonitor.enabled=${SYSMONITOR_ENABLED:true}
sysmonitor.broker.address=${AMQP_HOST:amqp-broker}
sysmonitor.broker.port=${AMQP_PORT:5671}
sysmonitor.local.cloud=${LOCAL_CLOUD:TestCloud}
sysmonitor.service.instance=GateTunnel
sysmonitor.ssl.key-store=file:/certs/GateTunnel.p12
sysmonitor.ssl.key-store-password=${ah.store-password}
sysmonitor.ssl.trust-store=file:/certs/truststore.p12
sysmonitor.ssl.trust-store-password=${ah.store-password}
mqtt.api.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Federation (5.2.2 environment names)
gatetunnel.local.cloud=${LOCAL_CLOUD:TestCloud}
gatetunnel.organization=${ORGANIZATION:Company}
gatetunnel.federation.profile=${FEDERATION_PROFILE:ah-gt-1}
gatetunnel.neighbor.clouds=${NEIGHBOR_CLOUDS:}
gatetunnel.federation.peer.organizations=${FEDERATION_PEER_ORGANIZATIONS:}
gatetunnel.advertised.address=${ADVERTISED_ADDRESS:gatetunnel}
gatetunnel.session.max.age.seconds=${SESSION_MAX_AGE_SECONDS:43200}
gatetunnel.session.idle.seconds=${SESSION_IDLE_SECONDS:3600}
gatetunnel.session.clock.skew.seconds=${SESSION_CLOCK_SKEW_SECONDS:120}
gatetunnel.intercloud.min.port=${INTERCLOUD_MIN_PORT:8200}
gatetunnel.intercloud.max.port=${INTERCLOUD_MAX_PORT:8299}
gatetunnel.control.min.port=${MIN_TUNNEL_PORT:8000}
gatetunnel.control.max.port=${MAX_TUNNEL_PORT:8099}
gatetunnel.relay.host=${RELAY_HOST:arrowhead-relay}
gatetunnel.relay.port=${RELAY_PORT:8883}
gatetunnel.relay.chain.cert=${RELAY_CHAIN_CERT:/certs/gatetunnel-relay-chain.crt}
gatetunnel.relay.key=${RELAY_KEY:/certs/gatetunnel-relay.key}
gatetunnel.relay.ca.cert=${RELAY_CA_CERT:/certs/org-ca.crt}
# AH-GT-1 peer revocation (SOS-4): comma-separated CRL files of the organization CA and every peer cloud CA; mandatory
gatetunnel.relay.crl.files=${RELAY_CRL_FILES:}
# SOS-6: the relay's server certificate is checked against the organisation CA's CRL, fail closed; mandatory
gatetunnel.relay.crl-file=${RELAY_CRL_FILE:/org-crl/org-ca.crl}
