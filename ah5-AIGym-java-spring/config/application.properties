spring.config.import=configtree:/run/secrets/
server.port=8478
server.ssl.enabled=true
server.ssl.key-store=file:/certs/AIGym.p12
server.ssl.key-store-password=${ah.store-password}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=AIGym.${LOCAL_CLOUD:TestCloud}.${ORGANIZATION:Company}.arrowhead.eu
server.ssl.trust-store=file:/certs/truststore.p12
server.ssl.trust-store-password=${ah.store-password}
server.ssl.client-auth=need
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
arrowhead.system-name=AIGym
arrowhead.cloud=${LOCAL_CLOUD:TestCloud}
arrowhead.password=${ah.identity-password}
arrowhead.registry-url=${SERVICE_REGISTRY_URL:https://serviceregistry:8443}
arrowhead.key-store=/certs/AIGym.p12
arrowhead.trust-store=/certs/truststore.p12
arrowhead.store-password=${ah.store-password}
arrowhead.advertised-host=aigym
arrowhead.amqp-host=${AMQP_HOST:amqp-broker}
arrowhead.amqp-port=${AMQP_PORT:5671}
arrowhead.mqtt-host=${MQTT_HOST:mqtt-broker}
arrowhead.mqtt-port=${MQTT_PORT:8883}
arrowhead.ssl.crl-file=/crl/ca.crl
