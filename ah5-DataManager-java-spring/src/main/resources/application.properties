############################################
###       APPLICATION PARAMETERS         ###
############################################

server.address=0.0.0.0
server.port=8461

# DataManager owns this database. It does not use the shared v4 Arrowhead schema.
spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/ah_datamanager?sslMode=trust
spring.datasource.username=datamanager
spring.datasource.password=gRLjXbqu0YwYhfK
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

mqtt.api.enabled=false

# When true, every dataProxy and dataHistorian call must come from a client certificate that matches the
# authenticated system and must be permitted by ConsumerAuthorization (authorization.verify). Production
# deployments enable it together with SSL; it requires a reachable ConsumerAuthorization.
service.authorization.enabled=false

# sysMonitor (SysMonitor-MQTT-IDD-5.2.2) replaces the v4.6 echo service. The common-library
# publisher sends echo, power and status observations to the local-cloud broker. With SSL enabled
# it uses mutual TLS with the server.ssl key and trust stores below.
sysmonitor.enabled=true
sysmonitor.broker.address=amqp-broker
sysmonitor.broker.port=5671
# sysmonitor.local.cloud defaults to the cloud part of this system's certificate CN
#sysmonitor.local.cloud=TestCloud
sysmonitor.service.instance=DataManager
sysmonitor.publish.interval=30

############################################
###          CUSTOM PARAMETERS           ###
############################################

domain.name=127.0.0.1
authentication.policy=declared
enable.management.filter=true
management.policy=authorization
enable.blacklist.filter=false
force.blacklist.filter=true
log.all.request.and.response=false
allow.self.addressing=true
allow.non.routable.addressing=false

# Extended normalization converts incoming system and service names to the
# PascalCase and camelCase forms required by the Arrowhead naming convention.
normalization.mode=extended

############################################
###             SSL MODE                 ###
############################################

server.ssl.enabled=false
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:certificate/DataManager.p12
server.ssl.key-store-password=123456
# Alias follows the local cloud name (ARROWHEAD_CLOUD_NAME, default TestCloud)
server.ssl.key-alias=DataManager.${arrowhead.cloud.name:TestCloud}.Company.arrowhead.eu
server.ssl.key-password=123456
server.ssl.client-auth=none
server.ssl.trust-store-type=PKCS12
server.ssl.trust-store=classpath:certificate/truststore.p12
server.ssl.trust-store-password=123456
disable.hostname.verifier=false
