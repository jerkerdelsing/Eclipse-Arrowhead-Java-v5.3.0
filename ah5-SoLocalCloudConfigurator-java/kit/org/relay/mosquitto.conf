# Arrowhead inter-cloud relay of a System of LocalClouds: MQTT over mutual TLS. Clients are the Gatekeepers and GateTunnels
# of the member clouds, authenticated by certificates chaining to the organisation CA through their cloud's
# name-constrained cross-certificate (C=SE, O=<org>, OU=<Cloud>). The verified subject (RFC 2253) is the MQTT user name
# the generated ACL uses, so one cloud cannot pose as a system of another.
persistence false
log_dest stdout
listener 8883 0.0.0.0
protocol mqtt
allow_anonymous false
require_certificate true
use_subject_as_username true
cafile /certs/org-ca.crt
certfile /certs/relay.crt
keyfile /certs/relay.key
tls_version tlsv1.2
crlfile /tmp/arrowhead-crl.pem
acl_file /mosquitto/config/acl
