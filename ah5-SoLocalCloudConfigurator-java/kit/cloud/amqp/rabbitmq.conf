# Local-cloud AMQP 0-9-1 broker: mutual TLS only, the full client certificate subject is the user name (M1).
# TLS options, including CRL checking, are in advanced.config.
listeners.tcp = none
listeners.ssl.default = 5671
auth_mechanisms.1 = EXTERNAL
ssl_cert_login_from = distinguished_name
load_definitions = /etc/rabbitmq/definitions.json
loopback_users = none
log.console = true
log.console.level = warning
