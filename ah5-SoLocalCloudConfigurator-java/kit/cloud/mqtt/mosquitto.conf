persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 8883 0.0.0.0
protocol mqtt
allow_anonymous false
require_certificate true
# The full verified subject is the user name (M1): only the system (sy) certificate of a name has its rights
use_subject_as_username true
cafile /certs/ca.crt
certfile /certs/mqtt-broker.crt
keyfile /certs/mqtt-broker.key
tls_version tlsv1.2
# Revocation (H3): CRL of the cloud CA (relay: of every cloud CA), kept current by crl-watch.sh, which reloads on change
crlfile /tmp/arrowhead-crl.pem
acl_file /mosquitto/config/acl
