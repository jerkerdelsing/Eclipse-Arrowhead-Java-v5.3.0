map $ssl_client_s_dn $arrowhead_identity {
    default "";
    ~CN=Authentication\.TestCloud\.Company\.arrowhead\.eu(?:,|$) "Bearer SYSTEM//Authentication";
}

server {
    listen 8443 ssl;
    server_name authentication-registry-mtls;

    # Docker service IPs change when containers are recreated. Resolve the
    # registry name per request instead of retaining nginx's startup address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate /certs/authentication-registry-mtls.crt;
    ssl_certificate_key /certs/authentication-registry-mtls.key;
    ssl_client_certificate /certs/ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 1;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($arrowhead_identity = "") { return 403; }

    location ~ ^/serviceregistry/(system-discovery|service-discovery)/(lookup|register|revoke)$ {
        set $registry_upstream serviceregistry:8443;
        proxy_pass http://$registry_upstream;
        proxy_set_header Host serviceregistry:8443;
        proxy_set_header Authorization $arrowhead_identity;
        proxy_set_header Content-Type $http_content_type;
    }

    location / { return 404; }
}
