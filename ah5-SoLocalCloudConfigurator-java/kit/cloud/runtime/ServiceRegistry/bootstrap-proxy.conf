# Keep subsequent register/revoke calls on the same fixed-identity listener by
# rewriting the registry endpoint returned from service discovery.
ssl_certificate /certs/registry-bootstrap-proxy.crt;
ssl_certificate_key /certs/registry-bootstrap-proxy.key;
ssl_client_certificate /certs/ca.crt;
ssl_verify_client on;
ssl_protocols TLSv1.2 TLSv1.3;
resolver 127.0.0.11 valid=5s ipv6=off;

server { listen 8501 ssl; location / { set $registry_upstream serviceregistry:8443; proxy_set_header Authorization "Bearer SYSTEM//DynamicServiceOrchestration"; proxy_set_header Host serviceregistry:8443; proxy_pass http://$registry_upstream; sub_filter_types application/json; sub_filter_once off; sub_filter '"serviceregistry"' '"registry-bootstrap-proxy"'; sub_filter '"authentication-registry-mtls"' '"registry-bootstrap-proxy"'; sub_filter '"accessPort":8443' '"accessPort":8501'; } }
server { listen 8502 ssl; location / { set $registry_upstream serviceregistry:8443; proxy_set_header Authorization "Bearer SYSTEM//ConsumerAuthorization"; proxy_set_header Host serviceregistry:8443; proxy_pass http://$registry_upstream; sub_filter_types application/json; sub_filter_once off; sub_filter '"serviceregistry"' '"registry-bootstrap-proxy"'; sub_filter '"authentication-registry-mtls"' '"registry-bootstrap-proxy"'; sub_filter '"accessPort":8443' '"accessPort":8502'; } }
server { listen 8503 ssl; location / { set $registry_upstream serviceregistry:8443; proxy_set_header Authorization "Bearer SYSTEM//Blacklist"; proxy_set_header Host serviceregistry:8443; proxy_pass http://$registry_upstream; sub_filter_types application/json; sub_filter_once off; sub_filter '"serviceregistry"' '"registry-bootstrap-proxy"'; sub_filter '"authentication-registry-mtls"' '"registry-bootstrap-proxy"'; sub_filter '"accessPort":8443' '"accessPort":8503'; } }
