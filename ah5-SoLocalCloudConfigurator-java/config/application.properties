# Production deployment overrides; the packaged application.properties is a development example.
spring.config.import=configtree:/run/secrets/
server.address=0.0.0.0
server.port=8496
domain.name=${SOLC_DOMAIN_NAME:solocalcloudconfigurator}
arrowhead.cloud.name=${LOCAL_CLOUD:TestCloud}
server.ssl.enabled=true
server.ssl.key-store=file:/certs/SoLocalCloudConfigurator.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${ah.store-password}
server.ssl.key-password=${ah.store-password}
server.ssl.key-alias=SoLocalCloudConfigurator.${LOCAL_CLOUD:TestCloud}.${ORGANIZATION:Company}.arrowhead.eu
server.ssl.trust-store=file:/certs/truststore.p12
server.ssl.trust-store-type=PKCS12
server.ssl.trust-store-password=${ah.store-password}
server.ssl.client-auth=need
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
disable.hostname.verifier=false
authentication.policy=outsourced
authenticator.credentials={'password':'${ah.identity-password}'}
service.interface.policy=CERT_AUTH
enable.management.filter=true
management.policy=sysop-only
service.authorization.enabled=true
solc.api.whitelist=${SOLC_API_WHITELIST:}
arrowhead.ssl.crl-file=${CRL_FILE:/crl/ca.crl}
service.registry.address=${SERVICE_REGISTRY_ADDRESS:serviceregistry}
service.registry.port=${SERVICE_REGISTRY_PORT:8443}
# providers (LocalCloudConfigurator, ConsumerAuthorization) are found through DynamicServiceOrchestration: only granted ones
http.collector.mode=ORCHESTRATION
http.collector.orchestration.ttl=${ORCHESTRATION_TTL_SECONDS:300}
spring.datasource.url=jdbc:mariadb://solocalcloudconfigurator-db:3306/ah_solocalcloudconfigurator?sslMode=verify-full&serverSslCert=/certs/db-ca.crt
spring.datasource.username=solocalcloudconfigurator
spring.datasource.password=${ah.db-password}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
sysmonitor.enabled=${SYSMONITOR_ENABLED:true}
sysmonitor.broker.address=${AMQP_HOST:amqp-broker}
sysmonitor.broker.port=${AMQP_PORT:5671}
sysmonitor.local.cloud=${LOCAL_CLOUD:TestCloud}
sysmonitor.service.instance=SoLocalCloudConfigurator
sysmonitor.ssl.key-store=file:/certs/SoLocalCloudConfigurator.p12
sysmonitor.ssl.key-store-password=${ah.store-password}
sysmonitor.ssl.trust-store=file:/certs/truststore.p12
sysmonitor.ssl.trust-store-password=${ah.store-password}
# organisation policy catalog: forbidden inter-cloud consumers and the inter-cloud capabilities of catalog components
solc.catalog.file=/app/catalogs/solc-policy.json
# the source that build-on-target packages pin (commit set at deployment; empty: packages must be assembled with --source)
solc.source.repository=${SOLC_SOURCE_REPOSITORY:https://github.com/jerkerdelsing/Eclipse-Arrowhead-Java-v5.3.0.git}
solc.source.commit=${SOLC_SOURCE_COMMIT:}
mqtt.api.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
