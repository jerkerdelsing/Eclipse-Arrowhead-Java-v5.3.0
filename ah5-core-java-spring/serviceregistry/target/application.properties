############################################
###       APPLICATION PARAMETERS         ###
############################################

# Address and port where the http webserver listening (0.0.0.0 denotes all available IP addresses)
server.address=0.0.0.0
server.port=8443

# Database connection (mandatory)
# Change the server timezone if neccessary
spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/ah_serviceregistry?sslMode=trust
spring.datasource.username=serviceregistry
spring.datasource.password=IsD3KDg8yfUblab
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
# use true only for debugging
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Spring Boot 4 (SOS-16, 2026-11-10): no in-memory default user with a generated password (J14); authentication is mTLS
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# MQTT API

mqtt.api.enabled=false
mqtt.broker.address=127.0.0.1
mqtt.broker.port=1883
mqtt.client.password=123456

############################################
###          CUSTOM PARAMETERS           ###
############################################

# Address to register into Service Registry with
domain.name=127.0.0.1

# Method to authenticate service requester systems
authentication.policy=declared

# Secret key for the authentication servers when authentication policy is 'outsourced'
# authenticator.secret.keys={\
# 	'Authentication': 'IJhl6xFr31p7g4l' \
# }

# Credentials to login to the authentication servers when authentication policy is 'outsourced' (should be changed after first login)
# authenticator.credentials={\
# 	'password': '123456' \
# }

# Enable/disable automatic authorization for management services
enable.management.filter=true

# Define the access policy for management services
# Values: sysop-only, whitelist, authorization
management.policy=authorization

# Name of systems which can access management service in case of whitelist policy
management.whitelist=DynamicServiceOrchestration,DeviceQoSEvaluator

# Enable/disable automatic system name verification against cloud level blacklist (lookup for 'blacklist' service and use it)
enable.blacklist.filter=false

# If true, the blacklist filter will filter out the request even if the blacklist server is not available
force.blacklist.filter=true

# Name of systems which are excluded from the blacklist check
# blacklist.check.exclude.list=

# Show all request/response in debug log
log.all.request.and.response=false

# Set to open in order to make services directly discoverable [open, restricted]
# When 'restricted', only the public core services are discoverable directly
service.discovery.policy=restricted

# Name of systems which always have direct access to service discovery
# Add every consumer of SimpleStoreServiceOrchestration that resolves instance identifiers with
# lookup: the restricted result silently omits instances without unrestrictedDiscovery=true.
# Add Gatekeeper when the cloud provides services to other clouds: it looks up local providers.
service.discovery.direct.access=DynamicServiceOrchestration,TranslationManager,DeviceQoSEvaluator

# Can lookup response contain system/device details (default is false)?
discovery.verbose=true

# How to handle non existing service interfaces during service registration [open, extendable, restricted]
# When 'restricted' only the already existing interface templates can be used,
# When 'extendable' then new interface template will be created with all the provided properties as mandatory properties
# When 'open' then new interface template will be created without further restrictions
service.discovery.interface.policy=restricted

# If true, the registration of systems and devices with self-addressing IPv4, IPv6 and hostname addresses are allowed.
# In case of self-addressing addresses the IP packets cannot be directed from one device to another.
allow.self.addressing=true

# If true, the registration of systems and devices with non-routable IPv4 and IPv6 addresses are allowed.
# In case of non-routable addresses the IP packets cannot be directed from one network to another.
allow.non.routable.addressing=false

# Alias keys under which the service addresses can appear in the interface properties
service.address.alias=address,addresses,accessAddress,accessAddresses,host,hosts

# Specifies the maximum number of records a page can contain
# max.page.size=

# Specifies how to normalize device, system, service definition, service operation, interface template names and cloud identifiers in requests. In simple mode, normalization only removes starting and
# ending whitespaces and the requester's responsibility to make sure the various naming conventions are used. In extended mode, normalization tries to transform inputs to follow the appropriate
# naming convention.
normalization.mode=extended

############################################
###              MONITORING              ###
############################################

# Publish the native sysMonitor service (SysMonitor-AMQP-IDD-5.2.2) over AMQPS. Enabled in the
# reference deployment; this sample stays off because it has no broker.
sysmonitor.enabled=false
#sysmonitor.broker.address=amqp-broker
#sysmonitor.broker.port=5671

############################################
###             SSL MODE                 ###
############################################

# configure secure mode

# Set this to false to disable https mode
# Development sample only. TLS is off here, and the authentication policy above may be 'declared'.
# A system refuses to start with these values unless arrowhead.security.profile=development is
# selected explicitly outside this file (for example ARROWHEAD_SECURITY_PROFILE=development) for an
# isolated test. Deployments use the secure configuration; see SECURITY-PROFILE.md in the repository root.
server.ssl.enabled=false

server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:certificate/ServiceRegistry.p12
server.ssl.key-store-password=123456
server.ssl.key-alias=ServiceRegistry.TestCloud.Company.arrowhead.eu
server.ssl.key-password=123456
# Set to "need" in case of CERTIFICATE authentication policy
server.ssl.client-auth=none
server.ssl.trust-store-type=PKCS12
server.ssl.trust-store=classpath:certificate/truststore.p12
server.ssl.trust-store-password=123456

# If true, http client does not check whether the hostname is match one of the server's SAN in its certificate
disable.hostname.verifier=false