############################################
###       APPLICATION PARAMETERS         ###
############################################

# Address and port where the http webserver listening (0.0.0.0 denotes all available IP addresses)
server.address=0.0.0.0
server.port=8445

service.registry.address=127.0.0.1
service.registry.port=8443

# Database connection (mandatory)
# Change the server timezone if neccessary
spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/ah_consumer_authorization?sslMode=trust
spring.datasource.username=consumerauthorization
spring.datasource.password=0BlG016nhDwmL47
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
# use true only for debugging
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# MQTT API

mqtt.api.enabled=false
mqtt.broker.address=127.0.0.1
mqtt.broker.port=1883
mqtt.client.password=123456

############################################
###          CUSTOM PARAMETERS           ###
############################################

# Address to register into Service Registry with
domain.name=127.0.0.1

# Method to authenticate service requester systems
authentication.policy=declared

# Secret key for the authentication servers when authentication policy is 'outsourced'
# authenticator.secret.keys={\
# 	'Authentication': 'IJhl6xFr31p7g4l' \
# }

# Credentials to login to the authentication servers
# The cloud operator need to register this system to this system to the Authentication Core system and fill the password field with the actual password before starting this system.
# authenticator.credentials={\
# 	'password': '123456' \
# }

# Enable/disable automatic authorization for management services
enable.management.filter=true

# Define the access policy for management services
# Values: sysop-only, whitelist, authorization
management.policy=authorization

# Name of systems which can access management service in case of whitelist policy
management.whitelist=DynamicServiceOrchestration,TranslationManager

# Enable/disable automatic system name verification against cloud level blacklist (lookup for 'blacklist' service and use it)
enable.blacklist.filter=false

# If true, the blacklist filter will filter out the request even if the blacklist server is not available
force.blacklist.filter=true

# Name of systems which are excluded from the blacklist check
# blacklist.check.exclude.list=

# Show all request/response in debug log
log.all.request.and.response=false

# Specifies the maximum number of records a page can contain
# max.page.size=

# Specifies how to normalize system, service definition, service operation names and cloud identifiers in requests. In simple mode, normalization only removes starting and
# ending whitespaces and the requester's responsibility to make sure the various naming conventions are used. In extended mode, normalization tries to transform inputs to follow the appropriate
# naming convention.
normalization.mode=extended

# Determines after how long to delete the tokens from the database (in minutes)
token.max.age=60

# Specifies the default duration of time limited tokens (simple time limited, json web tokens) in seconds.
token.time.limit=60

# Name of systems that can generate tokens for other systems by bypassing their authorization checks.
unbounded.token.generation.whitelist=DynamicServiceOrchestration,TranslationManager

# Simple token (time-limit, usage-limit) size in bytes. Cannot be less than 16!
simple.token.byte.size=32

# Maximum token usage default in case of usage-limit simple tokens
simple.token.usage.limit=5

# The secrets (consumer tokens, provider encryption keys) will be encrypted with this key before writing out into the database. Must be exactly 16 byte long!
secret.cryptographer.key=5v7xa6k0g9du8uz7

# Specifies how often (in milisec) to remove the expired and/or old tokens.
# cleaner.job.interval=

############################################
###              MONITORING              ###
############################################

# Publish the native sysMonitor service (SysMonitor-AMQP-IDD-5.2.2) over AMQPS. Enabled in the
# reference deployment; this sample stays off because it has no broker.
sysmonitor.enabled=false
#sysmonitor.broker.address=amqp-broker
#sysmonitor.broker.port=5671

############################################
###             SSL MODE                 ###
############################################

# configure secure mode

# Set this to false to disable https mode
# Development sample only. TLS is off here, and the authentication policy above may be 'declared'.
# A system refuses to start with these values unless arrowhead.security.profile=development is
# selected explicitly outside this file (for example ARROWHEAD_SECURITY_PROFILE=development) for an
# isolated test. Deployments use the secure configuration; see SECURITY-PROFILE.md in the repository root.
server.ssl.enabled=false

server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:certificate/ConsumerAuthorization.p12
server.ssl.key-store-password=123456
server.ssl.key-alias=ConsumerAuthorization.TestCloud.Company.arrowhead.eu
server.ssl.key-password=123456
# Set to "need" in case of CERTIFICATE authentication policy
server.ssl.client-auth=none
server.ssl.trust-store-type=PKCS12
server.ssl.trust-store=classpath:certificate/truststore.p12
server.ssl.trust-store-password=123456

# If true, http client does not check whether the hostname is match one of the server's SAN in its certificate
disable.hostname.verifier=false