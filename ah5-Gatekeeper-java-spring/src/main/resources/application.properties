############################################
###       APPLICATION PARAMETERS         ###
############################################

server.address=0.0.0.0
server.port=8449

service.registry.address=127.0.0.1
service.registry.port=8443

# Database connection (mandatory)
spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/ah_gatekeeper?sslMode=trust
spring.datasource.username=gatekeeper
spring.datasource.password=change-me
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

mqtt.api.enabled=false

sysmonitor.enabled=false
sysmonitor.broker.address=amqp-broker
sysmonitor.broker.port=5671
sysmonitor.service.instance=gatekeeper
sysmonitor.publish.interval=30

############################################
###          CUSTOM PARAMETERS           ###
############################################

domain.name=127.0.0.1
authentication.policy=declared
enable.management.filter=true
management.policy=whitelist
management.whitelist=LocalCloudManager,Sysop
service.authorization.enabled=true
log.all.request.and.response=false
normalization.mode=extended

############################################
###        GATEKEEPER PARAMETERS         ###
############################################

gatekeeper.local.cloud=TestCloud
gatekeeper.organization=Company
# legacy-mtls or ah-gt-1; never a silent downgrade
gatekeeper.federation.profile=legacy-mtls
# explicit cross-organisation bindings: <cloud>=<organization>,...
gatekeeper.federation.peer-organizations=
gatekeeper.relay.enabled=false
gatekeeper.relay.host=arrowhead-relay
gatekeeper.relay.port=8883
gatekeeper.relay.chain-cert=/certs/gatekeeper-relay-chain.crt
gatekeeper.relay.key=/certs/gatekeeper-relay.key
gatekeeper.relay.ca-cert=/certs/org-ca.crt
gatekeeper.relay.crl-file=

############################################
###             SSL MODE                 ###
############################################

# Development sample only. TLS is off here, and the authentication policy above is 'declared'.
# A system refuses to start with these values unless arrowhead.security.profile=development is
# selected explicitly outside this file (for example ARROWHEAD_SECURITY_PROFILE=development) for an
# isolated test. Deployments use config/application.properties; see SECURITY-PROFILE.md in the repository root.
server.ssl.enabled=false
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:certificate/Gatekeeper.p12
server.ssl.key-store-password=123456
server.ssl.key-alias=Gatekeeper.${arrowhead.cloud.name:TestCloud}.Company.arrowhead.eu
server.ssl.key-password=123456
server.ssl.client-auth=none
server.ssl.trust-store-type=PKCS12
server.ssl.trust-store=classpath:certificate/truststore.p12
server.ssl.trust-store-password=123456
disable.hostname.verifier=false
