# Production deployment overrides; base application properties remain development examples.
spring.config.import=configtree:/run/secrets/
server.address=0.0.0.0
server.port=8449
domain.name=gatekeeper
arrowhead.cloud.name=${LOCAL_CLOUD:TestCloud}
server.ssl.enabled=true
server.ssl.key-store=file:/certs/Gatekeeper.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${ah.store-password}
server.ssl.key-password=${ah.store-password}
server.ssl.key-alias=Gatekeeper.${LOCAL_CLOUD:TestCloud}.${ORGANIZATION:Company}.arrowhead.eu
server.ssl.trust-store=file:/certs/truststore.p12
server.ssl.trust-store-type=PKCS12
server.ssl.trust-store-password=${ah.store-password}
server.ssl.client-auth=need
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
disable.hostname.verifier=false
authentication.policy=outsourced
authenticator.credentials={'password':'${ah.identity-password}'}
service.interface.policy=CERT_AUTH
enable.management.filter=true
management.policy=whitelist
management.whitelist=LocalCloudManager,Sysop
service.authorization.enabled=true
arrowhead.ssl.crl-file=${CRL_FILE:/crl/ca.crl}
service.registry.address=${SERVICE_REGISTRY_ADDRESS:serviceregistry}
service.registry.port=${SERVICE_REGISTRY_PORT:8443}
http.collector.orchestration.ttl=${ORCHESTRATION_TTL_SECONDS:300}
spring.datasource.url=jdbc:mariadb://gatekeeper-db:3306/ah_gatekeeper?sslMode=verify-full&serverSslCert=/certs/db-ca.crt
spring.datasource.username=gatekeeper
spring.datasource.password=${ah.db-password}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
sysmonitor.enabled=${SYSMONITOR_ENABLED:true}
sysmonitor.broker.address=${AMQP_HOST:amqp-broker}
sysmonitor.broker.port=${AMQP_PORT:5671}
sysmonitor.local.cloud=${LOCAL_CLOUD:TestCloud}
sysmonitor.service.instance=Gatekeeper
sysmonitor.ssl.key-store=file:/certs/Gatekeeper.p12
sysmonitor.ssl.key-store-password=${ah.store-password}
sysmonitor.ssl.trust-store=file:/certs/truststore.p12
sysmonitor.ssl.trust-store-password=${ah.store-password}
gatekeeper.local.cloud=${LOCAL_CLOUD:TestCloud}
gatekeeper.organization=${ORGANIZATION:Company}
gatekeeper.federation.profile=${FEDERATION_PROFILE:ah-gt-1}
gatekeeper.federation.peer-organizations=${FEDERATION_PEER_ORGANIZATIONS:}
# SOS-7: neighbours of another organisation this cloud's consumers may use (Cloud|Organisation, comma-separated); default none
gatekeeper.federation.foreign-targets=${FEDERATION_FOREIGN_TARGETS:}
gatekeeper.relay.enabled=true
gatekeeper.relay.host=${RELAY_HOST:arrowhead-relay}
gatekeeper.relay.port=${RELAY_PORT:8883}
gatekeeper.relay.chain-cert=${RELAY_CHAIN_CERT:/certs/gatekeeper-relay-chain.crt}
gatekeeper.relay.key=${RELAY_KEY:/certs/gatekeeper-relay.key}
gatekeeper.relay.ca-cert=${RELAY_CA_CERT:/certs/org-ca.crt}
# The relay's server certificate is issued by the organisation CA (gatekeeper.relay.ca-cert), so its revocation is checked
# against the organisation CA's CRL, fail closed. The cloud CA's CRL (CRL_FILE) can never match that issuer: with it the
# relay connection always failed ("Revocation status unknown", 2026-11-09).
gatekeeper.relay.crl-file=${RELAY_CRL_FILE:/certs/org-ca.crl}
mqtt.api.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
