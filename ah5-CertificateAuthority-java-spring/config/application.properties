spring.config.import=configtree:/run/secrets/
server.address=0.0.0.0
server.port=8448
domain.name=certificate-authority
arrowhead.cloud.name=${LOCAL_CLOUD:TestCloud}
server.ssl.enabled=true
server.ssl.key-store=file:/certs/CertificateAuthority.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${ah.store-password}
server.ssl.key-password=${ah.store-password}
server.ssl.key-alias=CertificateAuthority.${LOCAL_CLOUD:TestCloud}.${ORGANIZATION:Company}.arrowhead.eu
server.ssl.trust-store=file:/certs/truststore.p12
server.ssl.trust-store-type=PKCS12
server.ssl.trust-store-password=${ah.store-password}
server.ssl.client-auth=need
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
disable.hostname.verifier=false
authentication.policy=outsourced
authenticator.credentials={'password':'${ah.identity-password}'}
service.interface.policy=CERT_AUTH
enable.management.filter=true
management.policy=whitelist
management.whitelist=CertificateAuthority,Onboarding
arrowhead.ssl.crl-file=${CRL_FILE:/crl/ca.crl}
service.registry.address=${SERVICE_REGISTRY_ADDRESS:serviceregistry}
service.registry.port=${SERVICE_REGISTRY_PORT:8443}
spring.datasource.url=jdbc:mariadb://certificate-authority-db:3306/ah_certificate_authority?sslMode=verify-full&serverSslCert=/certs/db-ca.crt
spring.datasource.username=certificateauthority
spring.datasource.password=${ah.db-password}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
sysmonitor.enabled=${SYSMONITOR_ENABLED:true}
sysmonitor.broker.address=${AMQP_HOST:amqp-broker}
sysmonitor.broker.port=${AMQP_PORT:5671}
sysmonitor.local.cloud=${LOCAL_CLOUD:TestCloud}
sysmonitor.service.instance=certificateAuthority
sysmonitor.ssl.key-store=file:/certs/CertificateAuthority.p12
sysmonitor.ssl.key-store-password=${ah.store-password}
sysmonitor.ssl.trust-store=file:/certs/truststore.p12
sysmonitor.ssl.trust-store-password=${ah.store-password}
ca.certificate.file=/certs/ca.crt
ca.key.file=/certs/ca.key
crl.dir=/crl
crl.validity.hours=${CRL_VALIDITY_HOURS:72}
crl.refresh.seconds=${CRL_REFRESH_SECONDS:3600}
cert.validity.days=${CERT_VALIDITY_DAYS:365}
onboarding.cert.validity.hours=${ONBOARDING_CERT_VALIDITY_HOURS:24}
mqtt.api.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
