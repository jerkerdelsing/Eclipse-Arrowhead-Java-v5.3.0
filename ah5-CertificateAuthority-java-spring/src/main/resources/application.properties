############################################
###       APPLICATION PARAMETERS         ###
############################################

server.address=0.0.0.0
server.port=8448

# CertificateAuthority owns this database: issued certificates, trusted keys and the operational logs.
spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/ah_certificate_authority?sslMode=trust
spring.datasource.username=certificateauthority
spring.datasource.password=change-me
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

mqtt.api.enabled=false

# Native sysMonitor (SysMonitor-AMQP-IDD-5.2.2) by the common-library publisher. The service instance keeps the
# native routing key <cloud>.sysmonitor.CertificateAuthority.certificateAuthority.
sysmonitor.enabled=false
sysmonitor.broker.address=amqp-broker
sysmonitor.broker.port=5671
sysmonitor.service.instance=certificateAuthority
sysmonitor.publish.interval=30

############################################
###          CUSTOM PARAMETERS           ###
############################################

domain.name=127.0.0.1
authentication.policy=declared
# Management paths (/mgmt/) are open to Sysop and to the identities below; the CA then applies its own rules:
# Sysop and CertificateAuthority manage, Onboarding may only revoke the certificates it requested.
enable.management.filter=true
management.policy=whitelist
management.whitelist=CertificateAuthority,Onboarding
log.all.request.and.response=false
allow.self.addressing=true
allow.non.routable.addressing=false
normalization.mode=extended

# Issuer certificate and signing key of the local cloud (PEM). Only the CertificateAuthority holds the key.
ca.certificate.file=/certs/ca.crt
ca.key.file=/certs/ca.key
# The CRL is published as <crl.dir>/ca.crl after every revocation and every crl.refresh.seconds; empty disables the file.
crl.dir=/crl
crl.validity.hours=168
crl.refresh.seconds=3600
cert.validity.days=365
onboarding.cert.validity.hours=24

############################################
###             SSL MODE                 ###
############################################

# Development sample only. TLS is off here, and the authentication policy above may be 'declared'.
# A system refuses to start with these values unless arrowhead.security.profile=development is
# selected explicitly outside this file (for example ARROWHEAD_SECURITY_PROFILE=development) for an
# isolated test. Deployments use the secure configuration; see SECURITY-PROFILE.md in the repository root.
server.ssl.enabled=false
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:certificate/CertificateAuthority.p12
server.ssl.key-store-password=123456
server.ssl.key-alias=CertificateAuthority.${arrowhead.cloud.name:TestCloud}.Company.arrowhead.eu
server.ssl.key-password=123456
server.ssl.client-auth=none
server.ssl.trust-store-type=PKCS12
server.ssl.trust-store=classpath:certificate/truststore.p12
server.ssl.trust-store-password=123456
disable.hostname.verifier=false
