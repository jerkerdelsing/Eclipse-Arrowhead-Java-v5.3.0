############################################
###       APPLICATION PARAMETERS         ###
############################################

server.address=0.0.0.0
server.port=8494

# SoSConfigurator owns this database: the record of submitted SoS deployments and the operational logs. The workflow state is
# kept by ColonyOS (COLONIES_* environment variables).
spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/ah_sosconfigurator?sslMode=trust
spring.datasource.username=sosconfigurator
spring.datasource.password=change-me
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

mqtt.api.enabled=false

# Native sysMonitor (SysMonitor-AMQP-IDD-5.2.2) by the common-library publisher.
sysmonitor.enabled=false
sysmonitor.broker.address=amqp-broker
sysmonitor.broker.port=5671
sysmonitor.service.instance=SoSConfigurator
sysmonitor.publish.interval=30

############################################
###          CUSTOM PARAMETERS           ###
############################################

domain.name=127.0.0.1
authentication.policy=declared
enable.management.filter=true
management.policy=sysop-only
log.all.request.and.response=false
allow.self.addressing=true
allow.non.routable.addressing=false
normalization.mode=extended

# sosConfiguration: Sysop, the systems listed here, and systems with a ConsumerAuthorization grant of the operation
sos.api.whitelist=
service.authorization.enabled=false
sos.catalog.file=catalogs/sos.json
sos.status.timeout.seconds=20

# Operator console: plain HTTP with password login (scrypt hash, see "sosconfigurator keygen"); 0 disables it
console.port=8495
console.address=127.0.0.1
console.password.hash=
console.allowed.hosts=127.0.0.1,localhost,[::1]
console.session.seconds=28800

############################################
###             SSL MODE                 ###
############################################

# Development sample only. TLS is off here, and the authentication policy above may be 'declared'.
# A system refuses to start with these values unless arrowhead.security.profile=development is
# selected explicitly outside this file (for example ARROWHEAD_SECURITY_PROFILE=development) for an
# isolated test. Deployments use the secure configuration; see SECURITY-PROFILE.md in the repository root.
server.ssl.enabled=false
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:certificate/SoSConfigurator.p12
server.ssl.key-store-password=123456
server.ssl.key-alias=SoSConfigurator.${arrowhead.cloud.name:TestCloud}.Company.arrowhead.eu
server.ssl.key-password=123456
server.ssl.client-auth=none
server.ssl.trust-store-type=PKCS12
server.ssl.trust-store=classpath:certificate/truststore.p12
server.ssl.trust-store-password=123456
disable.hostname.verifier=false
