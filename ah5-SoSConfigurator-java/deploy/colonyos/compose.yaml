# ColonyOS stack of the SoSConfigurator: TimescaleDB, the Colonies server and the configurator API/UI.
# The executors (one per local cloud and one for the relay) run on the hosts of the clouds and the relay
# (make executors-start), because they drive those hosts' docker compose and the clouds' management APIs with Sysop.
# All ports are published on loopback only. Secrets: make keygen (files in ./secrets, mode 0600).
# The configurator is an Arrowhead support system: it joins the selected cloud network (ARROWHEAD_NETWORK), registers in that
# cloud's ServiceRegistry with its own certificate, and keeps its records in its own MySQL database (sosconfigurator-db).
name: sos-colonyos

secrets:
  colonies_db_password: { file: ./secrets/colonies_db_password }
  colonies_server_id: { file: ./secrets/colonies_server_id }
  sos_api_prvkey: { file: ./secrets/sos_api_prvkey }
  sos_console_password_hash: { file: ./secrets/sos_console_password_hash }
  sos_db_password: { file: ./secrets/sos_db_password }
  sos_db_root_password: { file: ./secrets/sos_db_root_password }
  sos_store_password:
    file: ${STORE_PASSWORD_FILE:-./secrets/store-password}
  sos_identity_password:
    file: ${IDENTITY_PASSWORD_FILE:-./secrets/identity-password}

services:
  timescaledb:
    image: timescale/timescaledb:2.30.2-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/colonies_db_password
      TS_TUNE_MAX_CONNS: "200"
    secrets: [colonies_db_password]
    volumes: [timescaledb-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  colonies-server:
    image: colonyos/colonies:v1.9.10
    restart: unless-stopped
    depends_on:
      timescaledb: { condition: service_healthy }
    secrets: [colonies_db_password, colonies_server_id]
    environment:
      COLONIES_TLS: "false"
      COLONIES_SERVER_PORT: "50080"
      COLONIES_DB_HOST: timescaledb
      COLONIES_DB_PORT: "5432"
      COLONIES_DB_USER: postgres
      COLONIES_DB_TIMESCALEDB: "true"
      COLONIES_ALLOW_EXECUTOR_REREGISTER: "false"
      COLONIES_EXCLUSIVE_ASSIGN: "true"
      COLONIES_RETENTION: "false"
      COLONIES_CRON_CHECKER_PERIOD: "1000"
      COLONIES_GENERATOR_CHECKER_PERIOD: "500"
      COLONIES_VERBOSE: "false"
      TZ: Europe/Stockholm
    # Secrets as files: the server reads them from its environment, so they are exported only inside this shell.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        COLONIES_DB_PASSWORD=$$(cat /run/secrets/colonies_db_password)
        COLONIES_SERVER_ID=$$(cat /run/secrets/colonies_server_id)
        exec colonies server start --initdb --port 50080 --relayport 25100 --etcdname server1
        --etcdhost colonies-server --etcdclientport 23100 --etcdpeerport 24100
        --initial-cluster server1=colonies-server:24100:25100:50080 --etcddatadir /var/colonies/etcd --insecure
    volumes: [colonies-etcd:/var/colonies/etcd]
    ports: ["127.0.0.1:${SOS_COLONIES_PORT:-50081}:50080"]

  sosconfigurator:
    image: eclipse-arrowhead/sosconfigurator-java:5.2.2
    build: { context: ../.. }
    restart: unless-stopped
    depends_on:
      colonies-server: { condition: service_started }
      sosconfigurator-db: { condition: service_healthy }
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777", "/app/logs:rw,noexec,nosuid,nodev,size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    pids_limit: 256
    secrets:
      - sos_api_prvkey
      - { source: sos_console_password_hash, target: ah.console-password-hash }
      - { source: sos_db_password, target: ah.db-password }
      - { source: sos_store_password, target: ah.store-password }
      - { source: sos_identity_password, target: ah.identity-password }
    environment:
      COLONIES_SERVER_HOST: colonies-server
      COLONIES_SERVER_PORT: "50080"
      COLONIES_TLS: "false"
      COLONIES_COLONY_NAME: ${SOS_COLONY:-arrowhead-sos}
      COLONIES_PRVKEY_FILE: /run/secrets/sos_api_prvkey
      LOCAL_CLOUD: ${LOCAL_CLOUD:-TestCloud}
      ORGANIZATION: ${ORGANIZATION:-Company}
      SERVICE_REGISTRY_ADDRESS: ${SERVICE_REGISTRY_ADDRESS:-serviceregistry}
      SERVICE_REGISTRY_PORT: "${SERVICE_REGISTRY_PORT:-8443}"
      AMQP_HOST: ${AMQP_HOST:-amqp-broker}
      AMQP_PORT: "${AMQP_PORT:-5671}"
      SYSMONITOR_ENABLED: "${SYSMONITOR_ENABLED:-true}"
      SOS_API_WHITELIST: ${SOS_API_WHITELIST:-}
    volumes:
      - type: bind
        source: ${SYSTEM_KEYSTORE_FILE:-./secrets/SoSConfigurator.p12}
        target: /certs/SoSConfigurator.p12
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${TRUSTSTORE_FILE:-./secrets/truststore.p12}
        target: /certs/truststore.p12
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${DB_CA_FILE:-./secrets/db-ca.crt}
        target: /certs/db-ca.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${CRL_DIRECTORY:-./secrets/crl}
        target: /crl
        read_only: true
        bind: {create_host_path: false}
    ports:
      - "127.0.0.1:${SOS_API_PORT:-8494}:8494"
      - "127.0.0.1:${SOS_CONSOLE_PORT:-8495}:8495"
    networks:
      default: {}
      database: {}
      cloud:
        aliases: [sosconfigurator]

  sosconfigurator-db:
    build:
      context: ../..
      dockerfile: deployment/database/Dockerfile
    image: eclipse-arrowhead/sosconfigurator-java-db:5.2.2
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ah_sosconfigurator
      MYSQL_USER: sosconfigurator
      MYSQL_PASSWORD_FILE: /run/secrets/sos_db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/sos_db_root_password
    secrets: [sos_db_password, sos_db_root_password]
    command: ["--ssl-ca=/tls/ca.crt", "--ssl-cert=/tls/db.crt", "--ssl-key=/tls/db.key", "--require-secure-transport=ON"]
    volumes:
      - sos-db-data:/var/lib/mysql
      - type: bind
        source: ${DB_CA_FILE:-./secrets/db-ca.crt}
        target: /tls/ca.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${DB_CERT_FILE:-./secrets/db.crt}
        target: /tls/db.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${DB_KEY_FILE:-./secrets/db.key}
        target: /tls/db.key
        read_only: true
        bind: {create_host_path: false}
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=tcp -h127.0.0.1 --silent"]
      interval: 5s
      timeout: 4s
      retries: 30

volumes:
  timescaledb-data:
  colonies-etcd:
  sos-db-data:

networks:
  default:
    # Explicit subnet: the Docker Desktop default address pools are used up on the test host.
    ipam:
      config:
        - subnet: ${SOS_SUBNET:-10.240.91.0/24}
  database:
    internal: true
    ipam:
      config:
        - subnet: ${SOS_DB_SUBNET:-10.252.217.0/24}
  cloud:
    external: true
    name: ${ARROWHEAD_NETWORK:-arrowhead-local-cloud}
